<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF7F0" />
    <meta name="description" content="LetterLift pogrubia początki słów, żeby łatwiej było śledzić tekst. Bezpłatnie, bez konta, Twój tekst nie opuszcza urządzenia." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>LetterLift by Zem</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('letterlift:settings:v1')).theme;
        if (t === 'light' || t === 'dark' || t === 'sepia') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
